# This workflow installs dependencies, runs linting, type checks and tests.
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: pytest

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# https://github.com/aio-libs/aiohttp/issues/7229#issuecomment-1663772882
env:
  AIOHTTP_NO_EXTENSIONS: 1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Check formatting
        run: uv run ruff format --check custom_components tests
      - name: Lint
        run: uv run ruff check custom_components tests
      - name: Type check
        run: uv run ty check custom_components tests
      - name: Test with coverage
        run: uv run pytest
